<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Platform - Jugar online</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      #board { display:grid; grid-template-columns: repeat(8,48px); width:384px; border:1px solid #222; }
      .sq { width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:32px; cursor:pointer; }
      .light{ background:#f0d9b5; } .dark{ background:#b58863; }
      .selected{ outline:3px solid #00a2ff; }
      .row { margin: 8px 0; }
      #log { white-space: pre-wrap; background:#f7f7f7; padding:8px; max-width:700px; }
    </style>
  </head>
  <body>
    <h1>Chess Platform (MVP)</h1>
    <div class="row">
      <label>Sala:</label>
      <input id="roomId" value="demo" />
      <button id="joinBtn">Entrar</button>
      <button id="resetBtn">Reiniciar</button>
    </div>
    <div id="status" class="row">Desconectado</div>
    <div id="board"></div>
    <h3>PGN</h3>
    <div id="log"></div>

    <script>
      const pieces = {
        p:'♟', r:'♜', n:'♞', b:'♝', q:'♛', k:'♚',
        P:'♙', R:'♖', N:'♘', B:'♗', Q:'♕', K:'♔'
      };
      const boardEl = document.getElementById('board');
      const logEl = document.getElementById('log');
      const statusEl = document.getElementById('status');
      let ws, fen = null, selected = null;

      function parseFen(fen) {
        const rows = fen.split(' ')[0].split('/');
        const b=[];
        for (const r of rows) {
          const row=[];
          for (const ch of r) {
            if (/\d/.test(ch)) for (let i=0;i<Number(ch);i++) row.push('');
            else row.push(ch);
          }
          b.push(row);
        }
        return b;
      }

      function sqName(r,c){ return 'abcdefgh'[c] + (8-r); }

      function render() {
        if (!fen) return;
        const b = parseFen(fen);
        boardEl.innerHTML = '';
        for (let r=0;r<8;r++) for (let c=0;c<8;c++) {
          const div = document.createElement('div');
          div.className = 'sq ' + ((r+c)%2===0 ? 'light':'dark');
          div.dataset.sq = sqName(r,c);
          if (selected === div.dataset.sq) div.classList.add('selected');
          div.textContent = pieces[b[r][c]] || '';
          div.onclick = () => clickSq(div.dataset.sq);
          boardEl.appendChild(div);
        }
      }

      function clickSq(sq) {
        if (!selected) { selected = sq; render(); return; }
        if (selected === sq) { selected = null; render(); return; }
        ws.send(JSON.stringify({ type:'move', from:selected, to:sq, promotion:'q' }));
        selected = null;
      }

      function join() {
        const roomId = document.getElementById('roomId').value.trim();
        ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
        ws.onopen = () => { statusEl.textContent = 'Conectado'; ws.send(JSON.stringify({ type:'join', roomId })); };
        ws.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.type === 'state') {
            fen = msg.fen;
            render();
            logEl.textContent = msg.pgn || '(sin movimientos)';
            statusEl.textContent = `Turno: ${msg.turn === 'w' ? 'Blancas' : 'Negras'}${msg.isGameOver ? ' · Partida terminada' : ''}`;
          }
          if (msg.type === 'error') alert(msg.message);
        };
        ws.onclose = () => statusEl.textContent = 'Desconectado';
      }

      document.getElementById('joinBtn').onclick = join;
      document.getElementById('resetBtn').onclick = () => ws && ws.send(JSON.stringify({ type:'reset' }));
    </script>
  </body>
</html>
